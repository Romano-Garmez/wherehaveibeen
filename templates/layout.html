<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    {% block title %}{% endblock %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Heatmap layer for visitor-frequency view -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- Buffer drawing and math -->
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <!-- Custom CSS and scripts -->
    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="/static/js/cacheManager.js"></script>
    <script src="/static/js/statsPanel.js"></script>
    <script src="/static/js/datePicker.js"></script>
    <script src="/static/js/manageData.js"></script>
    <script src="/static/js/progressBar.js"></script>
    <script src="/static/js/drawOnMap.js"></script>
    <script src="/static/js/logIn.js"></script>

    <link rel="icon" type="image/x-icon" href="/static/favicon/wherehaveibeen.png">
</head>

<body class="{% block bodyclass %}{% endblock %}">
    <header class="topbar">
        <a class="brand" href="/">WhereHaveIBeen</a>

        <nav class="scope" aria-label="Map scope">
            <a class="scope__btn{% if request.path == '/' %} is-active{% endif %}" href="/">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                My Roads
            </a>
            <a class="scope__btn{% if request.path == '/everyone' %} is-active{% endif %}" href="/everyone">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span>Everyone<span class="scope__long">'s Roads</span></span>
            </a>
        </nav>

        <div class="topbar__spacer"></div>

        <div class="topbar__links">
            <a class="topbar__link{% if request.path == '/about' %} is-active{% endif %}" href="/about">About</a>
            <a class="topbar__link{% if request.path == '/how-to-use' %} is-active{% endif %}" href="/how-to-use">How to use</a>
        </div>

        {% if session.username %}
        <div class="user" id="userMenu">
            <button type="button" class="user__btn" onclick="toggleUserMenu()" aria-haspopup="true" aria-expanded="false">
                <span class="avatar">{{ session.username[:2]|upper }}</span>
                <span class="user__name">{{ session.username }}</span>
                <svg class="user__chev" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="user__menu" id="userMenuList" hidden>
                <a class="user__item user__item--mobile" href="/about">About</a>
                <a class="user__item user__item--mobile" href="/how-to-use">How to use</a>
                <a class="user__item" href="/sign_out">Sign out</a>
            </div>
        </div>
        {% else %}
        <a class="topbar__link" href="/">Log in</a>
        {% endif %}
    </header>

    <script>
        function toggleUserMenu() {
            const list = document.getElementById('userMenuList');
            const btn = document.querySelector('#userMenu .user__btn');
            if (!list) return;
            list.hidden = !list.hidden;
            if (btn) btn.setAttribute('aria-expanded', String(!list.hidden));
        }

        document.addEventListener('click', function (event) {
            const menu = document.getElementById('userMenu');
            const list = document.getElementById('userMenuList');
            if (!menu || !list || list.hidden) return;
            if (!menu.contains(event.target)) toggleUserMenu();
        });
    </script>

    {% block main %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>

</html>
